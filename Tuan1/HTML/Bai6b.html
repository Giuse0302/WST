<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="24689841" content="NguyenVinhLoi" />
    <title>Bai 6b</title>
  </head>
  <body>
    <form>
      <fieldset style="border: 1.5px solid lightskyblue">
        <h1>Contact Us</h1>
        <fieldset>
          <legend>Your message</legend>
          <table>
            <tr>
              <td><label for="To">To</label></td>
              <td>
                <input type="text" id="To" name="To" value="Example Cafe" />
              </td>
            </tr>
            <tr>
              <td><label for="Your email">Your email</label></td>
              <td><input type="text" id="Your email" name="Your email" /></td>
            </tr>
            <tr>
              <td><label for="Message">Message</label></td>
              <td><textarea name="Message" id="Message"></textarea></td>
            </tr>
            <tr>
              <td><label for="Attach File">Attach File</label></td>
              <td><input type="file" id="file" name="file" /></td>
              <td></td>
            </tr>
          </table>
        </fieldset>
        <fieldset>
          <legend>How you found us:</legend>
          <table>
            <tr>
              <td><label for="Heared">How did you hear of us</label></td>
              <td>
                <select name="Heared" id="Heared">
                  <option value="Google">Google</option>
                </select>
              </td>
            </tr>
            <tr>
              <td><label for="Newsletter">Newsletter</label></td>
              <td>
                <input
                  type="checkbox"
                  id="Ensure"
                  name="Newsletter"
                  value="Ensure"
                />Ensure this box is checked if you would like to receive email
                updates
              </td>
            </tr>
          </table>
        </fieldset>
        <input
          type="button"
          id="Send message"
          name="Sendmessage"
          value="Send message"
        />
      </fieldset>
    </form>
  </body>
</html>
