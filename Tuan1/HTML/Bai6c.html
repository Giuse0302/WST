<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="24689841" content="NguyenVinhLoi" />
    <title>Bai 6c</title>
  </head>
  <body>
    <form>
      <fieldset style="border: 1.5px solid lightskyblue">
        <table>
          <tr>
            <td>
              <label for="Name"> Name: </label>
            </td>
          </tr>
          <tr>
            <td>
              <input type="text" id="Name" name="Name" />
            </td>
          </tr>
          <tr>
            <td><label for="Tel">Telephone Number:</label></td>
          </tr>
          <tr>
            <td>
              <input type="text" id="Tel" name="Tel" />
            </td>
          </tr>
          <tr>
            <td>
              <label for="Email">Email:</label>
            </td>
          </tr>
          <tr>
            <td>
              <input type="text" id="Email" name="Email" />
            </td>
          </tr>
          <tr>
            <td>
              <label for="Fav_color">Favorite Color:</label>
            </td>
          </tr>
          <tr>
            <td>
              <input
                type="color"
                id="Fav_color"
                name="Fav_color"
                value="#0000ff"
              />
            </td>
          </tr>
          <tr>
            <td><label for="DoB">Date of Birth:</label></td>
          </tr>
          <tr>
            <td>
              <input type="date" id="DoB" name="DoB" value="2012-07-16" />
            </td>
          </tr>
          <tr align="center">
            <td>
              <input type="submit" />
            </td>
          </tr>
        </table>
      </fieldset>
    </form>
  </body>
</html>
